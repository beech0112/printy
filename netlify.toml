[dev]
  command = "npm run dev"
  port = 8888
  targetPort = 5173
  framework = "vite"
  envFiles = [".env.local"]

[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  # Ignore built assets from secrets scanning (client bundle legitimately contains public keys)
  SECRETS_SCAN_OMIT_PATHS = "dist/**"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

